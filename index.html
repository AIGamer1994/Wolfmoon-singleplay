                playDrawAnim(rc, 'deck', 2);
                logActionAndResult('你 執行【抽一打一】', `牌庫已空，從備用牌抽到(${rc.value})【${rc.title}】`, '你');
              } else {
                advanceTurn();
              }
              return;
            }

            const result = drawTurnCard(0);
            if (result.card) {
              setPlayerHands(prev => ({ ...prev, 0: [...currentHand, result.card] }));
              playDrawAnim(result.card, 'deck', 2);
              logActionAndResult('你 執行【抽一打一】', `抽到(${result.card.value})【${result.card.title}】`, '你');
            } else if (result.moon) {
              // 月亮牌已打出：仍只有 1 張手牌，可再選「抽一打一」或「拿一還一」
              if (!gameOverRef.current) setBroadcastResult(`➔ 月亮 ${stateRef.current.moonPhase}/3，請繼續【抽一打一】${reserveDrawRef.current === 0 ? '（牌庫已空，將從備用牌抽）' : ''}或【拿一還一】`);
            } else if (!gameOverRef.current) {
              advanceTurn();
            }
          };

          const closeCenterModal = () => {
            setIsCenterCardsModalOpen(false);
            setCenterPickMode(false);
            setPickSlot(null);
          };

          // 拿一還一：先開啟暗牌視窗，由玩家自選要拿哪一格
          const handleActionB = () => {
            if (lockRef.current) return;
            if (fx && fx.kind === 'moon') return;
            if (gameOver || players[currentTurnIndex].isAI) return;
            const currentHand = playerHands[0] || [];
            if (currentHand.length >= 2 || centerCards.filter(Boolean).length === 0) return;
            setPickSlot(null);
            setCenterPickMode(true);
            setIsCenterCardsModalOpen(true);
          };

          const confirmTakeCenter = (slot) => {
            if (lockRef.current || gameOver || players[currentTurnIndex].isAI) return;
            const currentHand = playerHands[0] || [];
            const taken = centerCards[slot];
            if (currentHand.length >= 2 || !taken) return;

            const newCenter = [...centerCards];
            newCenter[slot] = null; // 該格暫時空出，放回的牌會回到同一格
            setCenterCards(newCenter);
            setPlayerHands(prev => ({ ...prev, 0: [...currentHand, taken] }));
            playDrawAnim(taken, 'center', 2);
            setIsReturningCenterCard(true);
            setSelectedHandCard(null);
            takenCardRef.current = taken;
            takenSlotRef.current = slot;

            // 玩家看過這格暗牌
            setCenterMeta(prev => prev.map((m, i) => i === slot ? { ...m, viewedBy: m.viewedBy.includes(0) ? m.viewedBy : [...m.viewedBy, 0], myCard: taken, myStale: false } : m));
            setCenterKnownSet(prev => prev ? prev.filter(c => c.id !== taken.id) : prev);
            closeCenterModal();

            setBroadcastAction('你 執行【拿一還一】');
            setBroadcastResult(`➔ 從暗牌 ${slot + 1} 拿到(${taken.value})【${taken.title}】，請拖曳 1 張手牌到戰場，放回同一格`);
          };

          const handleCardClick = (card) => {
            if (gameOver || players[currentTurnIndex].isAI) return;
            const myHand = playerHands[0] || [];
            if (myHand.length < 2) return;

            setSelectedHandCard(selectedHandCard?.id === card.id ? null : card);
          };

          // ---- 拖曳出牌：把手牌向上拖到中央戰場（C 區）後放開即出牌；放在戰場外放開則取消
          const canDragPlay = () => (
            !gameOver && !players[currentTurnIndex].isAI && !actionLocked && !lockRef.current && !interactionModal &&
            (playerHands[0] || []).filter(Boolean).length >= 2
          );
          const isOverArena = (x, y) => {
            const el = arenaRef.current;
            if (!el) return false;
            const r = el.getBoundingClientRect();
            return x >= r.left - 8 && x <= r.right + 8 && y >= r.top - 8 && y <= r.bottom + 8;
          };
          const clearLongPress = () => {
            if (longPressRef.current) { clearTimeout(longPressRef.current); longPressRef.current = null; }
          };
          const handleHandPointerDown = (e, card) => {
            if (drawAnim) clearDrawAnim();
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            dragRef.current = { cardId: card.id, startX: e.clientX, startY: e.clientY, moved: false, zoomed: false, pointerId: e.pointerId };
            try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
            // 長按約 0.45 秒（期間沒有拖動）➔ 顯示放大的手牌，放開即關閉
            clearLongPress();
            longPressRef.current = setTimeout(() => {
              longPressRef.current = null;
              const d = dragRef.current;
              if (d && !d.moved) { d.zoomed = true; setZoomCard(card); }
            }, 450);
          };
          const handleHandPointerMove = (e) => {
            const d = dragRef.current;
            if (!d || d.pointerId !== e.pointerId) return;
            if (d.zoomed) return;
            if (!d.moved) {
              if (Math.hypot(e.clientX - d.startX, e.clientY - d.startY) < 10) return;
              clearLongPress();
              if (!canDragPlay()) return;
              d.moved = true;
            }
            const card = (playerHands[0] || []).find(c => c && c.id === d.cardId);
            if (!card) return;
            setDragGhost({ card, x: e.clientX, y: e.clientY, over: isOverArena(e.clientX, e.clientY) });
          };
          const handleHandPointerUp = (e) => {
            const d = dragRef.current;
            dragRef.current = null;
            clearLongPress();
            try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
            if (d && d.zoomed) { setZoomCard(null); lastTapRef.current = null; return; }
            if (d && !d.moved) {
              // 雙點同一張手牌 ➔ 直接出牌
              const now = Date.now();
              const lt = lastTapRef.current;
              const card = (playerHands[0] || []).find(c => c && c.id === d.cardId);
              if (lt && lt.cardId === d.cardId && now - lt.time < 380) {
                lastTapRef.current = null;
                if (card && canDragPlay()) handleConfirmPlay(card);
              } else {
                lastTapRef.current = { cardId: d.cardId, time: now };
              }
              return;
            }
            if (!d || !d.moved) return;
            const card = (playerHands[0] || []).find(c => c && c.id === d.cardId);
            const over = isOverArena(e.clientX, e.clientY);
            setDragGhost(null);
            if (card && over && canDragPlay()) handleConfirmPlay(card);
          };
          const handleHandPointerCancel = () => {
            dragRef.current = null;
            clearLongPress();
            setZoomCard(null);
            setDragGhost(null);
          };

          const handleConfirmPlay = (cardArg) => {
            const chosen = (cardArg && cardArg.id) ? cardArg : selectedHandCard;
            if (!chosen || players[currentTurnIndex].isAI) return;
            if (lockRef.current) return;
            lockRef.current = true;
            setActionLocked(true);
            
            if (isReturningCenterCard) {
              const cardToReturn = chosen;
              const remainingHand = (playerHands[0] || []).filter(c => c.id !== cardToReturn.id);
              const slotRef = takenSlotRef.current;
              const idx = (slotRef !== null && slotRef !== undefined) ? slotRef : Math.max(0, centerCards.findIndex(c => !c));

              setPlayerHands(prev => ({ ...prev, 0: remainingHand }));
              setCenterCards(prev => { const n = [...prev]; n[idx] = cardToReturn; return n; });
              metaApplySwap(idx, 0, cardToReturn);
              setSelectedHandCard(null);
              setIsReturningCenterCard(false);

              const taken = takenCardRef.current;
              logActionAndResult('你 執行【拿一還一】', `${taken ? `從暗牌 ${idx + 1} 拿到(${taken.value})【${taken.title}】，` : ''}放回(${cardToReturn.value})【${cardToReturn.title}】 ➔ 中央暗牌維持 3 張`, '你');
              takenCardRef.current = null;
              takenSlotRef.current = null;
              if (wolfWinAfterSwap(0, remainingHand)) return; // 放回之後手上握著狼人（第 3 張月亮後）➔ 立刻獲勝
              advanceTurn();
              return;
            }

            const cardToPlay = chosen;
            setSelectedHandCard(null);
            executePlayPhase(0, cardToPlay);
          };

          const executePlayPhase = (playerId, card) => {
            const player = stateRef.current.players.find(p => p.id === playerId);
            setPlayerHands(prev => ({ ...prev, [playerId]: (prev[playerId] || []).filter(c => c && c.id !== card?.id) }));
            setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, protected: card?.type === 'BODYGUARD', playedCards: [...p.playedCards, card] } : p));
            setPlayedCardArena({ ...card, playedBy: player.name });
            // 延後結算，確保讀到已更新的手牌與面前牌
            setTimeout(() => { if (!gameOverRef.current && resolveRef.current) resolveRef.current(playerId, card); }, 500 * slow());
          };

          // 醉漢：所有存活且未受保護的玩家（含自己）手牌收集洗勻後各發 1 張
          const doDrunkDeal = (sourceId) => {
            const stNow = stateRef.current;
            const source = stNow.players.find(p => p.id === sourceId);
            if (!source) { advanceTurn(); return; }
            const participants = stNow.players.filter(p => p.status === '存活' && (p.id === sourceId || !p.protected));
            const skipped = stNow.players.filter(p => p.status === '存活' && p.id !== sourceId && p.protected);
            const oldHands = stNow.playerHands; // 先記下洗牌前的手牌（之後 stateRef 會被改掉，不能再從 stNow 讀）
            let pool = [];
            participants.forEach(p => { pool.push(...(oldHands[p.id] || []).filter(Boolean)); });
            pool = shuffle(pool);
            const dealt = {};
            participants.forEach(p => { dealt[p.id] = pool.length ? [pool.pop()] : []; });
            stateRef.current.playerHands = { ...oldHands, ...dealt };
            setPlayerHands(prev => ({ ...prev, ...dealt }));
            logActionAndResult(
              `${source.name} 打出了(1)【醉漢】重洗手牌`,
              (skipped.length ? `全員手牌已重發（${skipped.map(p => p.name).join('、')} 受保護未參與）` : '全員手牌已重發') + (dealt[0] ? gotCardsText(dealt[0], oldHands[0]) : ''),
              source.name
            );
            advanceTurn();
          };

          const resolveCardEffect = (sourceId, card) => {
            const source = players.find(p => p.id === sourceId);
            if (!card || !card.type) return;

            switch (card.type) {
              case 'MAYOR':
              case 'WEREWOLF':
                logActionAndResult(`${source.name} 打出了(${card.value})【${card.title}】`, '自我淘汰！', source.name);
                eliminatePlayer(sourceId, sourceId, `打出【${card.title}】自我淘汰`);
                advanceTurn();
                break;

              case 'VAMPIRE':
                const highCards = (source.playedCards || []).filter(c => c && c.value >= 7);
                if (highCards.length >= 2) {
                  logActionAndResult(`${source.name} 打出了(${card.value})【吸血鬼】吸血鬼降臨`, `面前集滿 ${highCards.length} 張 7 以上的牌 ➔ 立刻獲勝`, source.name);
                  triggerVictory(source, '吸血鬼降臨：面前集滿兩張 7 以上卡牌，立刻勝利！');
                } else {
                  logActionAndResult(`${source.name} 打出了(${card.value})【吸血鬼】`, '沒有任何效果（面前高階牌不足）', source.name);
                  advanceTurn();
                }
                break;

              case 'BODYGUARD':
                logActionAndResult(`${source.name} 打出了(4)【保鏢】獲得保護`, '免役牌效直至下個回合', source.name);
                advanceTurn();
                break;

              case 'SERVANT':
                logActionAndResult(`${source.name} 打出了(1)【僕人】`, '置於面前 ➔ 回合結束時可棄掉換額外回合', source.name);
                advanceTurn();
                break;

              case 'DRUNKARD': {
                // 玩家自己打出醉漢：先秘密檢視所有參與者的手牌，按下「洗牌重發」才洗牌發牌
                if (sourceId === 0) {
                  const stV = stateRef.current;
                  const partsV = stV.players.filter(p => p.status === '存活' && (p.id === 0 || !p.protected));
                  const skippedV = stV.players.filter(p => p.status === '存活' && p.id !== 0 && p.protected);
                  const viewV = partsV.map(p => ({ p, card: ((stV.playerHands[p.id] || []).filter(Boolean))[0] || null }));
                  setDrunkSeen(viewV.filter(v => v.p.id !== 0 && v.card).map(v => ({ targetId: v.p.id, card: v.card })));
                  setInteractionModal({ type: 'DRUNK_VIEW', title: '醉漢：秘密檢視所有手牌', view: viewV, skipped: skippedV });
                  break;
                }
                doDrunkDeal(sourceId);
                break;
              }

              case 'VILLAGER':
              case 'ASSASSIN':
              case 'SEER':
              case 'TAX_COLLECTOR':
              case 'INQUISITOR':
              case 'BARKEEPER':
              case 'GIRL':
              case 'THIEF':
              case 'PICKPOCKET':
              case 'SWAP_HAND':
              case 'WITCH':
              case 'BOUNTY_HUNTER':
              case 'GRAVEDIGGER':
              case 'NIGHT_WATCHMAN': {
                if (card.type === 'WITCH' && sourceId === 0 && !stateRef.current.players.some(p => p.status === '出局')) {
                  logActionAndResult('你 打出了(4)【女巫】', '沒有任何效果（場上無人可復活）', '你');
                  advanceTurn();
                  break;
                }
                if (card.type === 'PICKPOCKET' && sourceId === 0 && !stateRef.current.players.some(p => p.id !== 0 && p.status === '存活' && !p.protected)) {
                  logActionAndResult('你 打出了(6)【扒手】', '沒有任何效果（可選對手不足）', '你');
                  advanceTurn();
                  break;
                }
                if (sourceId === 0) {
                  setInteractionModal({ type: card.type, card });
                } else {
                  handleAIEffectSelection(sourceId, card);
                }
                break;
              }

              default: {
                const passiveWhy = PASSIVE_WHY[card.title] || '';
                logActionAndResult(`${source.name} 打出了(${card.value})【${card.title}】`, passiveWhy ? `沒有任何效果（${passiveWhy}）` : '無任何效果', source.name);
                advanceTurn();
                break;
              }
            }
          };

          const handleAIEffectSelection = (sourceId, card) => {
            const aliveTargets = players.filter(p => p.id !== sourceId && p.status === '存活' && !p.protected);
            const sourcePlayer = players[sourceId];

            if (card.type === 'NIGHT_WATCHMAN') {
              const center = [...centerCards];
              const aiHand = playerHands[sourceId] || [];
              const combined = [...center, ...aiHand];
              // 第 3 張月亮翻開後，若看到狼人就留下它（留在手上即獲勝）；否則維持原本：留下自己的手牌
              const wolfPick = stateRef.current.moonPhase >= 3 ? combined.find(c => c && c.type === 'WEREWOLF') : null;
              const keepCard = wolfPick || combined[combined.length - 1];
              const restCards = combined.filter(c => c !== keepCard);
              setCenterCards(shuffle(restCards));
              metaWatchman(sourceId, null, '');
              setPlayerHands(prev => ({ ...prev, [sourceId]: [keepCard] }));
              logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【守夜人】`, '檢視中央暗牌 ➔ 重新洗牌歸位', sourcePlayer.name);
              if (wolfWinAfterSwap(sourceId, [keepCard])) return;
              advanceTurn();
              return;
            }

            if (card.type === 'GRAVEDIGGER') {
              const validTargets = players.filter(p => (p.id === sourceId || !p.protected) && p.playedCards.some(canSteal));
              if (validTargets.length > 0) {
                const target = validTargets[Math.floor(Math.random() * validTargets.length)];
                const stealable = target.playedCards.filter(canSteal);
                const { revealedBy: _rb, ...stolenCard } = stealable[Math.floor(Math.random() * stealable.length)];

                setPlayers(prev => prev.map(p => p.id === target.id ? { ...p, playedCards: p.playedCards.filter(c => c.id !== stolenCard.id) } : p));
                const newHand = [...(playerHands[sourceId] || []).filter(Boolean), stolenCard];
                setHandNow(sourceId, newHand);

                logActionAndResult(`${sourcePlayer.name} 對 ${target.name} 打出了(${card.value})【掘墓人】`, `奪取面前(${stolenCard.value})【${stolenCard.title}】`, sourcePlayer.name);

                // 後半段：從手牌（原手牌 + 奪取的牌）選 1 張打出並結算，沿用 AI 現有出牌邏輯
                // 等掘墓人動畫完整播完（且至少 3 秒）才打出第二張；點略過則立即進行
                whenFxDone(() => {
                  if (gameOverRef.current) return;
                  const h = (stateRef.current.playerHands[sourceId] || []).filter(Boolean);
                  const pick = aiPickCard(h);
                  if (pick) executePlayPhase(sourceId, pick);
                  else advanceTurn();
                }, 3000 * slow());
              } else {
                logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【掘墓人】`, '沒有任何效果（場上無卡牌可選）', sourcePlayer.name);
                advanceTurn();
              }
              return;
            }

            if (card.type === 'PICKPOCKET') {
              // 扒手可指定自己：候選＝所有存活且未受保護的對手＋出牌者自己
              const pickPool = [sourcePlayer, ...aliveTargets];
              if (pickPool.length < 2) {
                logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【扒手】`, '沒有任何效果（可選對手不足）', sourcePlayer.name);
              } else {
                const [a, b] = shuffle(pickPool);
                const aH = playerHands[a.id] || [];
                const bH = playerHands[b.id] || [];
                setPlayerHands(prev => ({ ...prev, [a.id]: bH, [b.id]: aH }));
                logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【扒手】`, `秘密交換了 ${a.name} 與 ${b.name} 的手牌${a.id === 0 ? gotCardsText(bH, aH) : (b.id === 0 ? gotCardsText(aH, bH) : '')}`, sourcePlayer.name);
              }
              advanceTurn();
              return;
            }

            if (aliveTargets.length === 0) {
              logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【${card.title}】`, '沒有任何效果（場面無有效目標）', sourcePlayer.name);
              advanceTurn();
              return;
            }
            const randomTarget = aliveTargets[Math.floor(Math.random() * aliveTargets.length)];

            switch (card.type) {
              case 'BOUNTY_HUNTER': {
                resolveBounty(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${card.value})【賞金獵人】`, sourcePlayer.name, sourceId, randomTarget.id);
                break;
              }
              case 'VILLAGER':
              case 'ASSASSIN': {
                const guessedVal = Math.floor(Math.random() * 11);
                executeGuess(sourceId, randomTarget.id, guessedVal, card.type === 'ASSASSIN');
                break;
              }
              case 'SEER':
                logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${card.value})【先知】`, `秘密檢視其手牌`, sourcePlayer.name);
                advanceTurn();
                break;
              case 'TAX_COLLECTOR': {
                const targetHand = playerHands[randomTarget.id] || [];
                const targetVal = targetHand[0] ? targetHand[0].value : '?';
                const isHit = targetHand.some(c => c?.value === 0 || c?.value === 1);
                logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(2)【稅務官】審查`, isHit ? `${randomTarget.name}(${targetVal})出局！` : `審查失敗 ➔ 手牌非 0 或 1`, sourcePlayer.name);
                if (isHit) eliminatePlayer(randomTarget.id, sourceId, '稅務官審查出局');
                advanceTurn();
                break;
              }
              case 'INQUISITOR': {
                const targetHand = playerHands[randomTarget.id] || [];
                const targetVal = targetHand[0] ? targetHand[0].value : '?';
                const isHit = targetHand.some(c => c?.value === 9 || c?.value === 10);
                logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(2)【審判官】審判`, isHit ? `${randomTarget.name}(${targetVal})出局！` : `審判失敗 ➔ 手牌非 9 或 10`, sourcePlayer.name);
                if (isHit) eliminatePlayer(randomTarget.id, sourceId, '審判官審判出局');
                advanceTurn();
                break;
              }
              case 'BARKEEPER':
              case 'GIRL': {
                const sHand = (playerHands[sourceId] || [])[0];
                const tHand = (playerHands[randomTarget.id] || [])[0];
                const cardVal = 3;
                const cardName = card.type === 'BARKEEPER' ? '酒保' : '小女孩';
                const cmpType = card.type === 'BARKEEPER' ? '比大' : '比小';
                if (sHand && tHand) {
                  if (card.type === 'BARKEEPER') {
                    if (sHand.value < tHand.value) {
                      logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${cardVal})【${cardName}】${cmpType}`, `${sourcePlayer.name}手牌(${sHand.value})較小出局！`, sourcePlayer.name, null, cmpReveal(sourcePlayer, sHand));
                      eliminatePlayer(sourceId, randomTarget.id, '酒保比大出局');
                    } else if (tHand.value < sHand.value) {
                      logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${cardVal})【${cardName}】${cmpType}`, `${randomTarget.name}手牌(${tHand.value})較小出局！`, sourcePlayer.name, null, cmpReveal(randomTarget, tHand));
                      eliminatePlayer(randomTarget.id, sourceId, '酒保比大出局');
                    } else {
                      logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${cardVal})【${cardName}】${cmpType}`, `平手無事發生`, sourcePlayer.name);
                    }
                  } else {
                    if (sHand.value > tHand.value) {
                      logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${cardVal})【${cardName}】${cmpType}`, `${sourcePlayer.name}手牌(${sHand.value})較大出局！`, sourcePlayer.name, null, cmpReveal(sourcePlayer, sHand));
                      eliminatePlayer(sourceId, randomTarget.id, '小女孩比小出局');
                    } else if (tHand.value > sHand.value) {
                      logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${cardVal})【${cardName}】${cmpType}`, `${randomTarget.name}手牌(${tHand.value})較大出局！`, sourcePlayer.name, null, cmpReveal(randomTarget, tHand));
                      eliminatePlayer(randomTarget.id, sourceId, '小女孩比小出局');
                    } else {
                      logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${cardVal})【${cardName}】${cmpType}`, `平手無事發生`, sourcePlayer.name);
                    }
                  }
                }
                advanceTurn();
                break;
              }
              case 'SWAP_HAND':
              case 'THIEF': {
                const sHand = playerHands[sourceId] || [];
                const tHand = playerHands[randomTarget.id] || [];
                setPlayerHands(prev => ({ ...prev, [sourceId]: tHand, [randomTarget.id]: sHand }));
                logActionAndResult(`${sourcePlayer.name} 對 ${randomTarget.name} 打出了(${card.value})【${card.title}】`, `手牌交換成功！獲得額外回合${randomTarget.id === 0 ? gotCardsText(sHand, tHand) : ''}`, sourcePlayer.name);
                setExtraTurnPlayerId(sourceId);
                advanceTurn();
                break;
              }
              case 'WITCH': {
                const deadPlayers = players.filter(p => p.status === '出局');
                if (deadPlayers.length > 0) {
                  const reviveP = deadPlayers[Math.floor(Math.random() * deadPlayers.length)];
                  const drawn = drawCardForPlayer(reviveP.id, false) || reserveCards[0];
                  setPlayerHands(prev => ({ ...prev, [reviveP.id]: [drawn] }));
                  setPlayers(prev => prev.map(p => p.id === reviveP.id ? { ...p, status: '存活', protected: false } : p));
                  setWitchTargetOwner({ witchOwnerId: sourceId, targetId: reviveP.id });
                  logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【女巫】`, `復活了 ${reviveP.name} ➔ 綁定共同勝利`, sourcePlayer.name, 'revive');
                } else {
                  logActionAndResult(`${sourcePlayer.name} 打出了(${card.value})【女巫】`, '沒有任何效果（場上無人可復活）', sourcePlayer.name);
                }
                advanceTurn();
                break;
              }
              default:
                advanceTurn();
                break;
            }
          };

          const executeGuess = (sourceId, targetId, guessedValue, isAssassin = false, skipSpy = false, secondGuessIn = null) => {
            const targetHand = (playerHands[targetId] || []).filter(Boolean);
            const target = players.find(p => p.id === targetId);
            const source = players.find(p => p.id === sourceId);
            const cardName = isAssassin ? '刺客' : '村民';
            const cardValue = isAssassin ? 0 : 1;

            // 刺客：兩次猜測（同一人）。人類自選；AI 隨機選一個不同數值
            let secondGuess = null;
            if (isAssassin) {
              if (secondGuessIn !== null && !Number.isNaN(secondGuessIn)) secondGuess = secondGuessIn;
              else {
                const pool = [...Array(11).keys()].filter(v => v !== guessedValue);
                secondGuess = pool[Math.floor(Math.random() * pool.length)];
              }
            }
            const guesses = isAssassin ? [guessedValue, secondGuess] : [guessedValue];
            const guessText = isAssassin ? `猜(${guessedValue})與(${secondGuess})` : `猜(${guessedValue})`;
            const actionText = `${source.name} 對 ${target.name} 打出了(${cardValue})【${cardName}】${guessText}`;
            const hitValue = guesses.find(g => targetHand.some(c => c.value === g));

            if (hitValue !== undefined) {
              logActionAndResult(actionText, `猜測成功！${target.name}(${hitValue}) 出局`, source.name);
              eliminatePlayer(targetId, sourceId, `遭猜中數值 ${hitValue}`);
              advanceTurn();
              return;
            }

            // 猜測未中：目標手握間諜可反殺
            const spyCardIndex = targetHand.findIndex(c => c.type === 'SPY');
            if (spyCardIndex !== -1 && !skipSpy) {
              if (targetId === 0) {
                setInteractionModal({ type: 'COUNTER_SPY', title: '間諜反殺', sourceId, targetId, guessedValue, secondGuess, isAssassin });
                return;
              }
              // AI 間諜觸發反殺：使猜測者出局，並接手其手牌
              const sourceHand = (stateRef.current.playerHands[sourceId] || []).filter(Boolean);
              setPlayers(prev => prev.map(p => p.id === targetId ? { ...p, playedCards: [...p.playedCards, targetHand[spyCardIndex]] } : p));
              logActionAndResult(actionText, `${target.name} 打出【間諜】反殺！${source.name} 出局且接手手牌`, target.name);
              eliminatePlayer(sourceId, null, '間諜反殺', true);
              setHandNow(sourceId, []);              // 被淘汰者的手牌已被接手，不再留在他手上
              setHandNow(targetId, sourceHand);
              advanceTurn();
              return;
            }

            logActionAndResult(actionText, '猜測失敗 ➔ 無事發生', source.name);
            advanceTurn();
          };

          const handleHumanInteractionSubmit = (payload) => {
            const { type, targetId, guessedValue, guessedValue2, secondaryTargetId, stolenCardId, keepCardId } = payload;
            const sourceId = 0;
            const target = players.find(p => p.id === targetId);
            setInteractionModal(null);

            if (type === 'SERVANT_CHOICE') {
              useServant(0, payload.servantId);
            } else if (type === 'DRUNK_VIEW') {
              doDrunkDeal(0);
            } else if (type === 'VILLAGER' || type === 'ASSASSIN') {
              executeGuess(0, targetId, parseInt(guessedValue), type === 'ASSASSIN', false, type === 'ASSASSIN' ? parseInt(guessedValue2) : null);
            } else if (type === 'NIGHT_WATCHMAN') {
              const myHand = playerHands[0] || [];
              const combined = [...centerCards, ...myHand];
              const keptCard = combined.find(c => c.id === keepCardId) || combined[0];
              const remainingCenter = combined.filter(c => c.id !== keptCard.id);
              const shuffledCenter = shuffle(remainingCenter);
              setCenterCards(shuffledCenter);
              const oldHandCard = myHand[0];
              const watchNoteText = (oldHandCard && keptCard.id !== oldHandCard.id)
                ? `你換出 (${keptCard.value})【${keptCard.title}】、換入 (${oldHandCard.value})【${oldHandCard.title}】`
                : '你沒有換出中央牌（留下原本的手牌）';
              metaWatchman(0, shuffledCenter, watchNoteText);
              setPlayerHands(prev => ({ ...prev, 0: [keptCard] }));
              logActionAndResult('你 打出了(3)【守夜人】', '檢視並調整中央暗牌 ➔ 成功保留 1 張卡牌', '你');
              if (wolfWinAfterSwap(0, [keptCard])) return; // 保留的是狼人（第 3 張月亮後）➔ 立刻獲勝
              advanceTurn();
            } else if (type === 'GRAVEDIGGER') {
              const targetP = players.find(p => p.id === targetId);
              const stolenRaw = targetP.playedCards.find(c => c.id === stolenCardId);
              if (stolenRaw && canSteal(stolenRaw)) {
                const { revealedBy: _rb, ...stolen } = stolenRaw;
                setPlayers(prev => prev.map(p => p.id === targetId ? { ...p, playedCards: p.playedCards.filter(c => c.id !== stolenCardId) } : p));
                setHandNow(0, [...(playerHands[0] || []).filter(Boolean), stolen]);
                logActionAndResult(`你 對 ${targetP.name} 打出了(6)【掘墓人】`, `奪取了面前(${stolen.value})【${stolen.title}】｜已加入你的手牌`, '你');
                // 後半段：解除鎖定，讓玩家從 2 張手牌中拖曳 1 張到戰場打出並結算（不結束回合）
                lockRef.current = false;
                setActionLocked(false);
                setSelectedHandCard(null);
                setBroadcastResult(`➔ 奪取了面前(${stolen.value})【${stolen.title}】，請拖曳 1 張手牌到戰場打出`);
              } else {
                logActionAndResult('你 打出了(6)【掘墓人】', '沒有任何效果（場面無可奪取之卡牌）', '你');
                advanceTurn();
              }
            } else if (type === 'BOUNTY_HUNTER') {
              resolveBounty(`你 對 ${targetId === 0 ? '自己' : target.name} 打出了(5)【賞金獵人】`, '你', 0, targetId);
            } else if (type === 'SEER') {
              const targetHand = playerHands[targetId] || [];
              const cName = targetHand[0] ? targetHand[0].title : '無';
              const cVal = targetHand[0] ? targetHand[0].value : '?';
              logActionAndResult(`你 對 ${target.name} 打出了(2)【先知】`, `秘密檢視結果 ➔ ${target.name} 手牌為 ${cName}(${cVal})`, '你');
              setSeerSeen(targetHand[0] ? { targetId, card: targetHand[0] } : null);
              setInteractionModal({ type: 'INFO', title: '先知檢視結果', infoCard: targetHand[0] || null, infoTarget: target });
              return;
              advanceTurn();
            } else if (type === 'TAX_COLLECTOR') {
              const targetHand = playerHands[targetId] || [];
              const targetVal = targetHand[0] ? targetHand[0].value : '?';
              const isHit = targetHand.some(c => c.value === 0 || c.value === 1);
              logActionAndResult(`你 對 ${target.name} 打出了(2)【稅務官】審查`, isHit ? `${target.name}(${targetVal})手牌符合 ➔ 宣佈出局！` : `審查失敗 ➔ ${target.name} 手牌非 0 或 1`, '你');
              if (isHit) eliminatePlayer(targetId, 0, '稅務官審查出局');
              advanceTurn();
            } else if (type === 'INQUISITOR') {
              const targetHand = playerHands[targetId] || [];
              const targetVal = targetHand[0] ? targetHand[0].value : '?';
              const isHit = targetHand.some(c => c.value === 9 || c.value === 10);
              logActionAndResult(`你 對 ${target.name} 打出了(2)【審判官】審判`, isHit ? `${target.name}(${targetVal})手牌符合 ➔ 宣佈出局！` : `審判失敗 ➔ ${target.name} 手牌非 9 或 10`, '你');
              if (isHit) eliminatePlayer(targetId, 0, '審判官審判出局');
              advanceTurn();
            } else if (type === 'BARKEEPER' || type === 'GIRL') {
              const sHand = (playerHands[0] || [])[0];
              const tHand = (playerHands[targetId] || [])[0];
              const cName = type === 'BARKEEPER' ? '酒保' : '小女孩';
              if (sHand && tHand) {
                if (type === 'BARKEEPER') {
                  if (sHand.value < tHand.value) {
                    logActionAndResult(`你 對 ${target.name} 打出了(3)【${cName}】比大`, `你的手牌(${sHand.value})較小 ➔ 你出局！`, '你', null, cmpReveal(players[0], sHand));
                    eliminatePlayer(0, targetId, '酒保比大出局');
                  } else if (tHand.value < sHand.value) {
                    logActionAndResult(`你 對 ${target.name} 打出了(3)【${cName}】比大`, `${target.name}手牌(${tHand.value})較小 ➔ ${target.name}出局！`, '你', null, cmpReveal(target, tHand));
                    eliminatePlayer(targetId, 0, '酒保比大出局');
                  } else {
                    logActionAndResult(`你 對 ${target.name} 打出了(3)【${cName}】比大`, `雙方數值相同 ➔ 平手無事發生`, '你');
                  }
                } else {
                  if (sHand.value > tHand.value) {
                    logActionAndResult(`你 對 ${target.name} 打出了(3)【${cName}】比小`, `你的手牌(${sHand.value})較大 ➔ 你出局！`, '你', null, cmpReveal(players[0], sHand));
                    eliminatePlayer(0, targetId, '小女孩比小出局');
                  } else if (tHand.value > sHand.value) {
                    logActionAndResult(`你 對 ${target.name} 打出了(3)【${cName}】比小`, `${target.name}手牌(${tHand.value})較大 ➔ ${target.name}出局！`, '你', null, cmpReveal(target, tHand));
                    eliminatePlayer(targetId, 0, '小女孩比小出局');
                  } else {
                    logActionAndResult(`你 對 ${target.name} 打出了(3)【${cName}】比小`, `雙方數值相同 ➔ 平手無事發生`, '你');
                  }
                }
              }
              advanceTurn();
            } else if (type === 'THIEF' || type === 'SWAP_HAND') {
              const sHand = playerHands[0] || [];
              const tHand = playerHands[targetId] || [];
              setPlayerHands(prev => ({ ...prev, 0: tHand, [targetId]: sHand }));
              logActionAndResult(`你 對 ${target.name} 打出了(7)【小偷】`, `手牌交換成功！獲得額外回合${gotCardsText(tHand, sHand)}`, '你');
              setExtraTurnPlayerId(0);
              advanceTurn();
            } else if (type === 'PICKPOCKET') {
              const t1 = players.find(p => p.id === targetId);
              const t2 = players.find(p => p.id === secondaryTargetId);
              const t1Hand = playerHands[targetId] || [];
              const t2Hand = playerHands[secondaryTargetId] || [];
              setPlayerHands(prev => ({ ...prev, [targetId]: t2Hand, [secondaryTargetId]: t1Hand }));
              const pickGot = targetId === 0 ? gotCardsText(t2Hand, t1Hand) : (secondaryTargetId === 0 ? gotCardsText(t1Hand, t2Hand) : '');
              logActionAndResult(`你 打出了(6)【扒手】`, `秘密交換了 ${t1.name} 與 ${t2.name} 的手牌${pickGot}`, '你');
              advanceTurn();
            } else if (type === 'WITCH') {
              const deadTargets = players.filter(p => p.status === '出局');
              if (deadTargets.length > 0 && targetId !== undefined && target) {
                const drawn = drawCardForPlayer(targetId, false) || reserveCards[0];
                setPlayerHands(prev => ({ ...prev, [targetId]: [drawn] }));
                setPlayers(prev => prev.map(p => p.id === targetId ? { ...p, status: '存活', protected: false } : p));
                setWitchTargetOwner({ witchOwnerId: 0, targetId });
                logActionAndResult(`你 打出了(4)【女巫】`, `復活了 ${target.name} ➔ 綁定共同勝利`, '你', 'revive');
              } else {
                logActionAndResult('你 打出了(4)【女巫】', '沒有任何效果（場上無人可復活）', '你');
              }
              advanceTurn();
            } else if (type === 'COUNTER_SPY') {
              const attacker = players.find(p => p.id === payload.attackerId);
              const attackerHand = playerHands[payload.attackerId] || [];
              logActionAndResult('你 打出了(7)【間諜】', `反殺猜測者 ${attacker.name}！該玩家淘汰並奪取其手牌${gotCardsText(attackerHand, [])}`, '你');
              eliminatePlayer(payload.attackerId, null, '間諜反殺出局', true);
              const spyC = (playerHands[0] || []).find(c => c && c.type === 'SPY');
              if (spyC) setPlayers(prev => prev.map(p => p.id === 0 ? { ...p, playedCards: [...p.playedCards, spyC] } : p));
              setHandNow(payload.attackerId, []);    // 被淘汰者的手牌已被接手，不再留在他手上
              setHandNow(0, attackerHand.filter(Boolean));
              advanceTurn();
            }
          };

          const proceedToNext = (forceExtra = null) => {
            lockRef.current = false;
            setActionLocked(false);
            const st = stateRef.current;
            const extra = forceExtra !== null ? forceExtra : st.extraTurnPlayerId;
            let nextIdx;
            if (extra !== null && st.players[extra] && st.players[extra].status === '存活') nextIdx = extra;
            else nextIdx = getNextAliveIndex(st.currentTurnIndex, st.players);
            setExtraTurnPlayerId(null);
            // 保鏢：下個回合開始時解除保護
            setPlayers(prev => prev.map(p => p.id === nextIdx ? { ...p, protected: false } : p));
            setCurrentTurnIndex(nextIdx);
            setTurnTick(t => t + 1);
            
          };

          const useServant = (pid, servantId) => {
            const p = stateRef.current.players.find(x => x.id === pid);
            setPlayers(prev => prev.map(x => x.id === pid ? { ...x, playedCards: x.playedCards.filter(c => !(c && c.id === servantId)) } : x));
            // 動畫播放期間先鎖住操作，播完才開始額外回合
            lockRef.current = true;
            setActionLocked(true);
            logActionAndResult(`${p.name} 棄掉面前【僕人】`, '立刻進行額外回合！', p.name);
            whenFxDone(() => {
              if (gameOverRef.current) return;
              proceedToNext(pid);
            }, 1200);
          };

          const advanceTurn = () => {
            const st0 = stateRef.current;
            const baseDelay = (st0.players[st0.currentTurnIndex]?.isAI ? 3000 : 1200) * slow();
            // 有效果動畫在播時，等動畫播完再換人
            whenFxDone(() => {
              if (gameOverRef.current) return;
              reserveDrawRef.current = null; // 回合結束：備用牌抽牌的豁免到此為止，牌庫已空即結算
              if (checkWinConditions()) return;
              const st = stateRef.current;
              const cur = st.players[st.currentTurnIndex];
              if (cur && cur.status === '存活' && st.extraTurnPlayerId === null) {
                const servant = cur.playedCards.find(c => c && c.type === 'SERVANT');
                if (servant) {
                  if (cur.isAI) { useServant(cur.id, servant.id); return; }
                  setInteractionModal({ type: 'SERVANT_CHOICE', title: '僕人', servantId: servant.id });
                  return;
                }
              }
              proceedToNext();
            }, baseDelay);
          };

          useEffect(() => {
            if (gameOver) return;

            // 僅在遊戲開始且牌庫真為0時檢查結算，防止初始化階段誤觸發
            if (deck.length === 0 && reserveDrawRef.current === null && playerHands[0] && playerHands[0].length > 0) {
              const alivePlayers = players.filter(p => p.status === '存活');
              resolveDeckEmptyVictory(alivePlayers);
              return;
            }

            const currentPlayer = players[currentTurnIndex];
            if (!currentPlayer) return;

            if (currentPlayer.status === '出局') {
              advanceTurn();
              return;
            }

            if (currentPlayer.isAI) {
              if (pausedRef.current) { pendingAiRef.current = true; return; }
              const cancelAiWait = whenFxDone(async () => {
                if (pausedRef.current) { pendingAiRef.current = true; return; }
                pendingAiRef.current = false;
                const myToken = ++aiRunRef.current;
                const stale = () => gameOverRef.current || aiRunRef.current !== myToken;
                const sleep = (ms) => new Promise(r => setTimeout(r, ms));
                const pid = currentPlayer.id;

                let hand = (stateRef.current.playerHands[pid] || []).filter(Boolean);
                let drawnCard = null;
                while (hand.length < 2 && stateRef.current.deck.length > 0) {
                  if (hand.length === 1 && stateRef.current.centerCards.some(Boolean) && Math.random() < 0.25) {
                    aiCenterSwap(pid);
                    return;
                  }
                  const result = drawTurnCard(pid);
                  if (result.gameEnded || gameOverRef.current) return;
                  if (result.card) { drawnCard = result.card; break; }
                  if (result.moon) {
                    // 月亮牌展示停留 3 秒，讓玩家看清楚，再抽下一張
                    await new Promise(r => whenFxDone(r, 1500 * slow()));  // 等月亮動畫播完
                    while (pausedRef.current && !stale()) await sleep(300);
                    if (stale()) return;
                    continue;
                  }
                  break;
                }

                if (!drawnCard && hand.length < 2 && reserveDrawRef.current === pid && stateRef.current.deck.length === 0) {
                  // 牌庫最後一張月亮翻開後，AI 的抽牌改從備用牌隨機抽 1 張
                  const rc = drawReserveCard();
                  if (rc) {
                    const nm = stateRef.current.players.find(p => p.id === pid).name;
                    logActionAndResult(`${nm} 從備用牌抽牌`, '牌庫已空 ➔ 抽 1 張備用牌', nm);
                    drawnCard = rc;
                  }
                }

                if (drawnCard) {
                  hand = [...hand, drawnCard];
                  setHandNow(pid, hand);
                }

                if (hand.length >= 2) {
                  const safeCard = aiPickCard(hand);
                  if (safeCard) executePlayPhase(pid, safeCard);
                  else advanceTurn();
                } else {
                  advanceTurn();
                }
              }, 1200 * slow(), true);

              return () => cancelAiWait();
            }
          }, [currentTurnIndex, gameOver, turnTick]);

          const myHand = playerHands[0] || [];
          resolveRef.current = resolveCardEffect;

          // 面前的牌：該玩家所有打出（或被公開）而放在面前的牌；同一張牌只列一次
          const getFrontCards = (p) => {
            const map = new Map();
            const order = [];
            (p.playedCards || []).forEach((c, idx) => {
              if (!c) return;
              const key = c.id || `${c.title}-${idx}`;
              const prev = map.get(key);
              if (!prev) order.push(key);
              map.set(key, { ...c, revealedBy: c.revealedBy || (prev && prev.revealedBy) });
            });
            return order.map(k => map.get(k));
          };

          // 長期有效、仍在作用的牌 ➔ 標示「生效中」：僕人、商人、煉金術士、保鏢（保護期間）、
          // 仍握在手上的賞金獵人公開牌、女巫（復活者仍綁定時）
          const isCardActive = (p, c) => {
            if (!p || !c || p.status !== '存活') return false;
            if (c.type === 'SERVANT' || c.title === '商人' || c.title === '煉金術士') return true;
            if (c.type === 'BODYGUARD') return !!p.protected;
            if (c.revealedBy === 'BOUNTY') return (playerHands[p.id] || []).some(h => h && h.id === c.id);
            if (c.title === '女巫') return !!witchTargetOwner && witchTargetOwner.witchOwnerId === p.id;
            return false;
          };

          const handleNextGame = () => {
            if (winnerInfo && winnerInfo.matchWinners && winnerInfo.matchWinners.length > 0) { winsRef.current = {}; setWins({}); }
            initGame();
          };

          // 結算後攤牌：單張牌的小標籤
          const revealChip = (c, key) => c ? (

            <span key={key} className="inline-flex items-center bg-slate-800/50 border border-dashed border-slate-600 rounded px-1.5 py-0.5 text-[10px] text-slate-500 whitespace-nowrap">已取走</span>

                    </span>
                  </div>

                    <button onClick={() => setShowBroadcast(v => !v)} className={`flex items-center justify-center h-6 whitespace-nowrap border text-[10px] font-bold px-1.5 rounded-md shadow-sm active:scale-95 ${showBroadcast ? 'bg-emerald-500/25 border-emerald-400/70 text-emerald-200' : 'bg-slate-800/90 border-slate-600/60 text-slate-400'}`}>動態</button>
                    {[0.5].map(v => (
                      <button key={v} onClick={() => changeSpeed(v)} className={`flex items-center justify-center h-6 whitespace-nowrap border text-[10px] font-mono font-bold px-1.5 rounded-md shadow-sm active:scale-95 ${speed === v ? 'bg-sky-500/25 border-sky-400/80 text-sky-200' : 'bg-slate-800/90 border-slate-500/50 text-slate-400'}`}>{v}x</button>
                    ))}
                    <button onClick={() => setIsRulesModalOpen(true)} className="flex items-center justify-center h-6 gap-1 whitespace-nowrap bg-slate-800/90 border border-amber-500/40 text-amber-300 text-[11px] px-2 rounded-md shadow-sm active:scale-95">
                      <i className="fa-solid fa-book-open text-amber-400 text-[10px]"></i>
                      <span className="font-bold text-[10px]">規則</span>
                    </button>
                    <button onClick={() => setIsHistoryModalOpen(true)} className="flex items-center justify-center h-6 gap-1 whitespace-nowrap bg-slate-800/90 border border-purple-500/40 text-purple-300 text-[11px] px-2 rounded-md shadow-sm active:scale-95">

                            </div>

                          </span>

                      {broadcastReveal && (

                      <div className="flex items-center space-x-1 bg-slate-900/90 border border-amber-500/40 px-2 py-0.5 rounded-full text-[9.5px] shadow">
                        <i className="fa-solid fa-moon text-amber-400"></i>
                        <span className="text-slate-400">月亮</span>
                        <span className="font-mono text-amber-400 font-bold">{moonPhase}/3</span>
                      </div>
                      
                    </div>
                    <div className="absolute right-0 top-0 z-20 flex flex-row items-center space-x-1">
                      <div className="flex items-center justify-center h-[22px] space-x-1 bg-slate-900/90 border border-cyan-500/40 px-2 rounded-full text-[9.5px] shadow">
                        <i className="fa-solid fa-box-archive text-cyan-400"></i>
                        <span className="font-bold text-cyan-300">備用牌 <span className="font-mono text-cyan-400">{reserveCards.filter(Boolean).length}</span></span>
                      </div>
                      <button
                        onClick={() => { setCenterPickMode(false); setIsCenterCardsModalOpen(true); }}
                        className="flex items-center justify-center h-[22px] space-x-1 bg-slate-900/90 border border-amber-500/50 hover:border-amber-400 px-2 rounded-full text-[9.5px] shadow active:scale-95 transition-all cursor-pointer"
                      >
                        <i className="fa-solid fa-eye text-amber-400"></i>
                        <span className="font-bold text-amber-300">暗牌 <span className="font-mono text-amber-400">{centerCards.filter(Boolean).length}</span></span>
                      </button>
                      <button
                        onClick={() => setIsDeckModalOpen(true)}
                        className="flex items-center justify-center h-[22px] space-x-1 bg-slate-900/90 border border-amber-500/50 hover:border-amber-400 px-2 rounded-full text-[9.5px] shadow active:scale-95 transition-all cursor-pointer"
                      >
                        <i className="fa-solid fa-layer-group text-amber-400"></i>
                        <span className="font-bold text-amber-300">牌庫 <span className="font-mono text-amber-400">{deck.length}</span></span>
                      </button>
                    </div>

                    {(gameOver && victoryDismissed) ? (
                      <div className="absolute inset-x-0 top-7 bottom-0 overflow-y-auto scrollbar-none px-0.5 space-y-1.5 text-[10px]">
                        <div className="flex items-center justify-between">
                          <span className="font-black text-amber-300 text-[11px]"><i className="fa-solid fa-eye mr-1"></i>全部攤牌</span>
                          <button onClick={() => setVictoryDismissed(false)} className="text-[9.5px] font-bold text-purple-300 bg-slate-900/90 border border-purple-500/40 px-2 py-0.5 rounded-full active:scale-95">查看結算</button>
                        </div>
                        <div className="space-y-1">
                          {players.map(p => {
                            const hand = (playerHands[p.id] || []).filter(Boolean);
                            const isWin = !!(winnerInfo && winnerInfo.winnerIds && winnerInfo.winnerIds.includes(p.id));
                            const out = p.status === '出局';
                            return (
                              <div key={p.id} className={`flex items-center justify-between gap-1 rounded-lg border px-1.5 py-1 ${isWin ? 'border-amber-400/70 bg-amber-500/10' : 'border-slate-700 bg-slate-900/70'}`}>
                                <span className="flex items-center gap-1 shrink-0">
                                  <Avatar p={p} size="w-5 h-5" />
                                  <span className={`truncate ${p.id === 0 ? 'text-sky-300 font-black' : 'text-slate-200 font-bold'}`}>{p.name}</span>
                                  {isWin && <span>🏆</span>}
                                  {out && <span className="text-[9px] font-black text-rose-300 border border-rose-500/50 rounded px-1">出局</span>}
                                </span>
                                <span className="flex flex-wrap gap-1 justify-end">
                                  {hand.length > 0 ? hand.map((c, i) => revealChip(c, i)) : <span className="text-slate-500">{out ? (p.handTaken ? '手牌已被間諜接手' : '手牌已公開於面前') : '無手牌'}</span>}
                                </span>
                              </div>

                          })}
                        </div>
                        <div className="rounded-lg border border-amber-500/30 bg-slate-900/70 px-1.5 py-1">
                          <div className="text-[9.5px] font-black text-amber-300 mb-1">中央暗牌</div>

                            ))}
                          </div>

                        <div className="rounded-lg border border-cyan-500/30 bg-slate-900/70 px-1.5 py-1">
                          <div className="text-[9.5px] font-black text-cyan-300 mb-1">備用牌堆</div>
                          <div className="flex flex-wrap gap-x-2 gap-y-1">

                      </div>
                    ) : playedCardArena ? (

                        <div className="relative w-36 h-[190px] bg-slate-900 border-2 border-amber-400 rounded-xl p-2.5 flex flex-col justify-between shadow-2xl overflow-hidden">

                            <span className="bg-amber-500 text-slate-950 text-sm font-black w-7 h-7 rounded-full flex items-center justify-center shadow font-mono">{playedCardArena.value}</span>
                            {playedCardArena.isMoon && <span className="text-[10px] bg-slate-800 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded font-bold">{playedCardArena.category}</span>}
                          </div>
                          <div className="w-full h-16 my-1 rounded-lg bg-slate-800 border border-slate-700/70 flex items-center justify-center relative overflow-hidden">
                            <i className={`fa-solid ${playedCardArena.icon} text-4xl text-amber-400/80 filter drop-shadow`}></i>
                          </div>
                          <div className="text-center">
                            <h3 className="text-sm font-black text-amber-300 tracking-wide">{playedCardArena.title}</h3>
                            <p className="text-[9px] text-slate-300 line-clamp-2 mt-0.5 leading-tight">{playedCardArena.desc}</p>

                    ) : (

                        等待玩家行動...
                      </div>
                    )}
                    {replay && replay.fx && <FxOverlay key={`r${replay.n}`} fx={replay.fx} onSkip={closeReplay} replay={{}} />}
                    {!replay && fx && !(gameOver && victoryDismissed) && <FxOverlay key={fx.key} fx={fx} onSkip={skipFx} />}
                  </div>
                </main>

                {/* D區: 底部手牌與操作區 */}
                <footer className="h-[30%] min-h-[210px] bg-gradient-to-t from-slate-950 via-slate-900 to-slate-950 border-t border-slate-800 p-2 relative shrink-0 flex items-center justify-center">
                  {gameOver && victoryDismissed && (

              {/* 彈窗：玩家面前的牌 */}
              {viewPlayerId !== null && (() => {

                const cards = getFrontCards(vp);
                const isTarget = witchTargetOwner && witchTargetOwner.targetId === vp.id;
                const isOwner = witchTargetOwner && witchTargetOwner.witchOwnerId === vp.id;

                            關閉
                          </button>

                  </div>

            </div>

        // 互動對話框組件
        function WatchCard({ c, icon, selected, onClick }) {

            <button type="button" onClick={onClick} className={`relative rounded-lg border-2 px-1.5 pt-1.5 pb-1 bg-slate-800 flex flex-col items-center gap-0.5 transition ${selected ? 'border-amber-400 ring-2 ring-amber-400/70 -translate-y-0.5' : 'border-slate-600'}`}>

        function InteractionDialog({ modal, players, playerHands, centerCards, remainingCounts, allCards, onSubmit, onCancel }) {
          const [selectedTarget, setSelectedTarget] = useState('');
          const [secondaryTarget, setSecondaryTarget] = useState('');
          const [guessedVal, setGuessedVal] = useState('0');
          const [guessedVal2, setGuessedVal2] = useState('1');
          const [selectedStolenCard, setSelectedStolenCard] = useState('');
          const [selectedKeepCard, setSelectedKeepCard] = useState('');

          const aliveTargets = players.filter(p => p.id !== 0 && p.status === '存活' && !p.protected);
          const deadTargets = players.filter(p => p.status === '出局');

          const isGuess = modal.type === 'VILLAGER' || modal.type === 'ASSASSIN';

          // 猜測用：各數值尚未現身的角色與張數（牌庫清單的剩餘數，再扣掉自己手上的牌）
          const unseenText = (v) => {
            const myTitles = (playerHands[0] || []).filter(Boolean).map(c => c.title);
            const parts = (allCards || []).filter(c => c.value === v).map(c => {
              const base = ((remainingCounts || {})[c.title] || { current: c.totalCount }).current;
              const n = Math.max(0, base - myTitles.filter(t => t === c.title).length);
              return n > 0 ? `${c.title}${n > 1 ? '×' + n : ''}` : null;
            }).filter(Boolean);
            return parts.length ? parts.join('、') : '已無';
          };

          // 掘墓人選定的玩家面前可奪取卡牌
          const gravediggerTarget = players.find(p => p.id.toString() === selectedTarget);
          const availableStolenCards = gravediggerTarget ? gravediggerTarget.playedCards.filter(canSteal) : [];

          // 守夜人可選擇的卡牌組合 (手牌 + 中央暗牌)
          const watchmanHand = playerHands[0] || [];
          const watchmanOptions = [...centerCards, ...watchmanHand].filter(Boolean);

          return (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-emerald-500/50 rounded-2xl w-full max-w-xs p-4 shadow-2xl relative">
                <h3 className="text-sm font-bold text-emerald-300 border-b border-slate-800 pb-2 mb-3">

                {modal.type === 'INFO' ? (
                  <div>
                    {modal.infoTarget && (

                        {modal.infoCard ? (
                          <div className="w-[130px] h-[180px] bg-slate-900 border-2 border-cyan-500/80 rounded-xl p-2 flex flex-col justify-between shadow-[0_0_12px_rgba(6,182,212,0.3)]">
                            <span className="bg-cyan-500 text-slate-950 text-sm font-black w-6 h-6 rounded-full flex items-center justify-center font-mono">{modal.infoCard.value}</span>
                            <div className="w-full h-16 bg-slate-800/90 rounded-lg border border-slate-700/60 flex items-center justify-center my-1">
                              <i className={`fa-solid ${modal.infoCard.icon} text-3xl text-cyan-400`}></i>
                            </div>
                            <div className="text-center">
                              <div className="text-xs font-black text-slate-100 truncate tracking-wide">{modal.infoCard.title}</div>
                              <div className="text-[8.5px] text-slate-300 line-clamp-3 leading-tight mt-0.5">{modal.infoCard.desc}</div>
                            </div>
                          </div>

                      </div>
                    )}
                    {modal.message && <p className="text-xs text-slate-300 mb-4 whitespace-pre-line">{modal.message}</p>}
                    <button onClick={onCancel} className="w-full bg-emerald-600 text-white text-xs py-2 rounded-xl font-bold">確定</button>
                  </div>
                ) : modal.type === 'DRUNK_VIEW' ? (
                  <div>
                    <p className="text-[11px] text-slate-300 mb-3">你拿走了所有玩家的手牌並秘密檢視（只有你看得到）。按下按鈕後，這些牌會面朝下洗勻，再隨機發給每位玩家 1 張。</p>
                    <div className="grid grid-cols-3 gap-2 mb-3">
                      {(modal.view || []).map(v => (
                        <div key={v.p.id} className="flex flex-col items-center gap-1 rounded-lg border border-slate-700/70 bg-slate-800/60 py-1.5">
                          <FxChip p={v.p} size="w-9 h-9 text-base" />
                          {v.card ? <FxFace c={v.card} cls="w-12 h-[64px]" /> : <span className="text-[10px] text-slate-500 h-[64px] flex items-center">無手牌</span>}
                        </div>
                      ))}
                    </div>
                    {modal.skipped && modal.skipped.length > 0 && (
                      <div className="text-[10px] font-bold text-cyan-300 mb-3"><i className="fa-solid fa-shield-halved mr-1"></i>{modal.skipped.map(p => p.name).join('、')} 受保護未參與</div>
                    )}
                    <button onClick={() => onSubmit({ type: 'DRUNK_VIEW' })} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs py-2 rounded-xl font-bold"><i className="fa-solid fa-shuffle mr-1"></i>洗牌重發</button>
                  </div>
                ) : modal.type === 'SERVANT_CHOICE' ? (

                    <div className="flex space-x-2">
                      <button onClick={() => onSubmit({ type: 'COUNTER_SPY', attackerId: modal.sourceId })} className="flex-1 bg-emerald-600 text-white text-xs py-2 rounded-xl font-bold">反殺打出</button>

                  <div className="space-y-3 text-xs">
                    {/* 守夜人卡牌選擇 */}
                    {modal.type === 'NIGHT_WATCHMAN' ? (
                      <div className="space-y-2">
                        <div className="text-slate-400">中央暗牌（3 張，完整翻開）：</div>
                        <div className="grid grid-cols-3 gap-2">
                          {centerCards.filter(Boolean).map(c => (
                            <WatchCard key={c.id} c={c} icon={(allCards.find(x => x.title === c.title) || {}).icon} selected={selectedKeepCard === c.id} onClick={() => setSelectedKeepCard(c.id)} />

                        <div className="grid grid-cols-3 gap-2">
                          {watchmanHand.filter(Boolean).map(c => (

                        <div className="space-y-1.5 max-h-[45vh] overflow-y-auto pr-0.5 scrollbar-none">

                              <div className="flex flex-wrap gap-1.5 min-w-0">
                                {p.playedCards.filter(canSteal).map(c => {
                                  const sel = selectedStolenCard === c.id;
                                  return (
                                    <button type="button" key={c.id} onClick={() => { setSelectedTarget(String(p.id)); setSelectedStolenCard(c.id); }} className={`rounded-md border-2 px-1.5 py-1 flex items-center gap-1 bg-slate-900 active:scale-95 ${sel ? 'border-amber-400 ring-2 ring-amber-400/70' : 'border-slate-600'}`}>
                                      <span className="font-mono font-black text-amber-300 text-xs">{c.value}</span>
                                      <i className={`fa-solid ${c.icon || 'fa-circle'} text-amber-400 text-[10px]`}></i>
                                      <span className="text-[10px] font-black text-amber-100 whitespace-nowrap">{c.title}</span>
                                    </button>
                                  );
                                })}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    ) : modal.type === 'WITCH' ? (
                      <PlayerPicker label="選擇復活玩家：" value={selectedTarget} onChange={setSelectedTarget} options={deadTargets} />
                    ) : modal.type === 'PICKPOCKET' ? (
                      <>
                        <PlayerPicker label="選擇目標玩家 1（可選自己）：" value={selectedTarget} onChange={v => { setSelectedTarget(v); if (v === secondaryTarget) setSecondaryTarget(''); }} options={[players[0], ...aliveTargets]} />
                        <PlayerPicker label="選擇目標玩家 2（可選自己）：" value={secondaryTarget} onChange={setSecondaryTarget} options={[players[0], ...aliveTargets].filter(p => p.id.toString() !== selectedTarget)} />
                      </>
                    ) : (
                      <PlayerPicker label={modal.type === 'BOUNTY_HUNTER' ? '選擇目標（可選自己）：' : '選擇對手目標：'} value={selectedTarget} onChange={setSelectedTarget} options={modal.type === 'BOUNTY_HUNTER' ? [players[0], ...aliveTargets] : aliveTargets} />
                    )}

                    {/* 猜測數值選擇 */}
                    {isGuess && (
                      <div>
                        <label className="block text-slate-400 mb-1">{modal.type === 'ASSASSIN' ? '第 1 次猜測數值 (0–10)：' : '宣告手牌數值 (0–10)：'}</label>
                        <select value={guessedVal} onChange={e => { const v = e.target.value; setGuessedVal(v); if (v === guessedVal2) setGuessedVal2(v === '0' ? '1' : '0'); }} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-amber-300 font-bold">
                          {[...Array(11).keys()].map(v => <option key={v} value={v}>數值 {v}（{unseenText(v)}）</option>)}
                        </select>
                      </div>
                    )}
                    {modal.type === 'ASSASSIN' && (
                      <div>
                        <label className="block text-slate-400 mb-1">第 2 次猜測數值 (0–10，同一目標)：</label>
                        <select value={guessedVal2} onChange={e => setGuessedVal2(e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-amber-300 font-bold">
                          {[...Array(11).keys()].filter(v => v.toString() !== guessedVal).map(v => <option key={v} value={v}>數值 {v}（{unseenText(v)}）</option>)}
                        </select>
                      </div>
                    )}

                    <div className="flex space-x-2 pt-2">
                      <button 
                        disabled={
                          modal.type === 'NIGHT_WATCHMAN' ? !selectedKeepCard :
                          modal.type === 'GRAVEDIGGER' ? (!selectedTarget || !selectedStolenCard) :
                          modal.type === 'PICKPOCKET' ? (!selectedTarget || !secondaryTarget) :
                          !selectedTarget
                        }
                        onClick={() => onSubmit({ 
                          type: modal.type, 
                          targetId: parseInt(selectedTarget), 
                          secondaryTargetId: parseInt(secondaryTarget), 
                          guessedValue: guessedVal,
                          guessedValue2: guessedVal2,
                          stolenCardId: selectedStolenCard,
                          keepCardId: selectedKeepCard
                        })} 
                        className="flex-1 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-bold py-2 rounded-xl"
                      >
                        確認發動
                      </button>
                      <button onClick={onCancel} className="bg-slate-800 text-slate-300 px-3 py-2 rounded-xl">取消</button>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
